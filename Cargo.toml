[package]
name = "cubex-rs"
version = "0.1.0"
edition = "2021"
description = "Cubex — Native Rust Voxel Engine with Embedded LuaJIT & Mineclonia Compatibility"

[dependencies]
winit = "0.30"
wgpu = "24"
egui = "0.31.1"
egui-wgpu = "0.31.1"
egui-winit = "0.31.1"
mlua = { version = "0.10.5", features = ["luajit", "vendored", "serialize"] }
rayon = "1.10"
glam = { version = "0.29", features = ["serde"] }
image = "0.25"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytemuck = { version = "1", features = ["derive"] }
flate2 = "1"
base64 = "0.22"
sha1 = "0.10"
parking_lot = "0.12"
pollster = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dirs = "5"
regex = "1"
rand = "0.8"
rodio = { version = "0.20", default-features = false, features = ["vorbis"] }
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
